[project]
name = "receiptwarehouse"
version = "0.1.0"
description ="Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling==2.150.0",
    "fastapi[standard]==0.162.5",
    "markdown-it-py==4.3.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlmodel==0.0.49",
    "typer==0.27.3",
    "sqlalchemy[asyncio]==2.1.8",
    "aiosqlite>=0.17.0",
    "simplejson==4.3.0",
    "asyncpg>=0.32.0",
    "fastapi-mcp>=0.4.0",
    "torchvision>=0.29.2",
    "onnxruntime-gpu[cuda,cudnn]>=1.31.1",
    "scipy-stubs==1.18.1.1",
    "opencv-python>=5.0.0.93",
    "scipy==1.18.1",
    "numpy==2.5.4",
    "docling-core>=2.106.0",
    "requests>=2.34.2",
    "starlette==1.10.0",
    "anyio==4.16.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]

#[[tool.uv.index]]
#name = "pytorch-cpu"
#url = "https://download.pytorch.org/whl/cpu"
#explicit = true
#
#[tool.uv.sources]
#torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu134" }
torchvision = { index = "pytorch-cu134" }

[tool.ruff.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.params.Query"]
